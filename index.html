<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก - KORO STORE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-rose-50 to-pink-200 min-h-screen flex items-center justify-center p-4 md:p-8">

  <!-- Main Container: ปรับขนาดอัตโนมัติ (มือถือ = กล่องเดี่ยว / คอม = 2 คอลัมน์) -->
  <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl w-full max-w-sm md:max-w-3xl overflow-hidden border border-white/40 grid grid-cols-1 md:grid-cols-2">
    
    <!-- ฝั่งซ้าย: แบนเนอร์ / โลโก้ร้าน (แสดงด้านบนในมือถือ, แสดงด้านซ้ายในคอม) -->
    <div class="bg-gradient-to-br from-pink-500 to-rose-400 p-6 md:p-10 text-white flex flex-col justify-center items-center text-center space-y-4">
      <div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-3xl shadow-inner border border-white/30">
        <i class="fa-solid fa-cart-shopping text-white"></i>
      </div>
      <div>
        <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight">KORO STORE</h2>
        <p class="text-xs md:text-sm text-pink-100 mt-1">ระบบสมาชิกสะสมแต้ม</p>
      </div>
      <div class="bg-white/20 backdrop-blur-sm border border-white/30 rounded-xl p-3 text-xs md:text-sm font-medium w-full max-w-xs">
        🎁 ทุกการสั่งซื้อ 10 บาท = 1 แต้ม<br>
        <span class="text-[11px] opacity-90">* สะสมแต้มไว้แลกส่วนลดได้ตลอดปี</span>
      </div>
    </div>

    <!-- ฝั่งขวา: ฟอร์มกรอกข้อมูล -->
    <div class="p-6 md:p-10 flex flex-col justify-center space-y-5 bg-white">
      
      <!-- LINE Profile Box -->
      <div id="profile-box" class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center gap-3 shadow-sm hidden">
        <img id="user-picture" src="" class="w-10 h-10 rounded-full border-2 border-pink-400 object-cover">
        <div class="text-left min-w-0 flex-1">
          <div class="text-[10px] text-gray-400 font-medium">เชื่อมต่อกับบัญชี LINE:</div>
          <div id="user-name" class="font-bold text-gray-800 text-sm truncate">-</div>
        </div>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 text-left">
        <input type="hidden" id="line-user-id">

        <div>
          <label class="text-xs font-bold text-gray-700 block mb-1">ชื่อ-นามสกุล <span class="text-rose-500">*</span></label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 text-sm">
              <i class="fa-regular fa-user"></i>
            </span>
            <input type="text" id="member-name" required placeholder="ระบุชื่อ-นามสกุลของคุณ" 
              class="w-full border border-gray-200 rounded-xl pl-9 pr-3 py-2.5 text-sm focus:ring-2 focus:ring-pink-500 focus:outline-none bg-gray-50/50">
          </div>
        </div>

        <div>
          <label class="text-xs font-bold text-gray-700 block mb-1">เบอร์โทรศัพท์ (10 หลัก) <span class="text-rose-500">*</span></label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 text-sm">
              <i class="fa-solid fa-mobile-screen"></i>
            </span>
            <input type="tel" id="member-phone" required pattern="[0-9]{10}" maxlength="10" placeholder="08XXXXXXXX" 
              class="w-full border border-gray-200 rounded-xl pl-9 pr-3 py-2.5 text-sm font-semibold tracking-wider text-gray-800 focus:ring-2 focus:ring-pink-500 focus:outline-none bg-gray-50/50">
          </div>
        </div>

        <button type="submit" id="btn-submit" 
          class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 active:scale-95 text-white py-3 rounded-xl font-bold text-sm shadow-md shadow-pink-500/20 transition flex items-center justify-center gap-2 mt-2">
          ✨ ยืนยันการสมัครสมาชิก
        </button>
      </form>

      <div class="text-[11px] text-gray-400 text-center border-t pt-3">
        * สมัครครั้งเดียว ใช้สะสมแต้มและรับส่วนลดได้ตลอด
      </div>
    </div>

  </div>

  <script>
    const LIFF_ID = "2011897462-WxM66h4q"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwvzYVQZQWuV0uBSb1ex_ymoGx8gNyw-2d3HyNPPNUFl3zblN-QGzIPGLAt7ZdhM4NaEw/exec";

    window.onload = function() {
      if (typeof liff !== 'undefined' && LIFF_ID) {
        liff.init({ liffId: LIFF_ID }).then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(profile => {
              document.getElementById('line-user-id').value = profile.userId;
              document.getElementById('user-name').innerText = profile.displayName;
              document.getElementById('user-picture').src = profile.pictureUrl || 'https://via.placeholder.com/150';
              document.getElementById('member-name').value = profile.displayName;
              document.getElementById('profile-box').classList.remove('hidden');
            });
          } else {
            liff.login();
          }
        }).catch(err => console.error("LIFF Init Error:", err));
      }
    };

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = "กำลังบันทึกข้อมูล...";

      const payload = {
        action: "add",
        name: document.getElementById('member-name').value.trim(),
        phone: document.getElementById('member-phone').value.trim(),
        lineUserId: document.getElementById('line-user-id').value || ""
      };

      try {
        const formData = new FormData();
        formData.append('payload', JSON.stringify(payload));

        const res = await fetch(GAS_URL, { method: "POST", body: formData });
        const data = await res.json();

        if (data.status === "duplicate") {
          Swal.fire({ title: 'แจ้งเตือน', text: data.message || 'เป็นสมาชิกอยู่แล้วค่ะ', icon: 'warning', confirmButtonColor: '#ec4899' });
          btn.disabled = false;
          btn.innerText = "✨ ยืนยันการสมัครสมาชิก";
        } else {
          Swal.fire({ title: '🎉 สมัครสมาชิกสำเร็จ!', text: 'ขอบคุณที่สมัครสมาชิก KORO STORE ค่ะ!', icon: 'success', confirmButtonColor: '#ec4899' })
            .then(() => { if (typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow(); });
        }
      } catch (err) {
        Swal.fire({ title: '🎉 สมัครสมาชิกสำเร็จ!', text: 'ขอบคุณที่สมัครสมาชิก KORO STORE ค่ะ!', icon: 'success', confirmButtonColor: '#ec4899' })
          .then(() => { if (typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow(); });
      }
    }
  </script>
</body>
</html>
