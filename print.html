<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KORO STORE - ฝากพิมพ์ / ถ่ายเอกสาร</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 font-sans text-gray-800">
  <div class="max-w-md mx-auto bg-white rounded-3xl p-6 shadow-xl border space-y-4">
    <div class="text-center border-b pb-3">
      <h2 class="text-xl font-black text-indigo-900">📑 ฝากพิมพ์ / ถ่ายเอกสาร KORO STORE</h2>
      <p class="text-xs text-gray-500">ส่งไฟล์ล่วงหน้า มารับเอกสารหน้าร้านได้เลยไม่ต้องรอคิว (ขนาด A4)</p>
    </div>

    <form id="print-form" onsubmit="submitPrintOrder(event)" class="space-y-3 text-xs">
      <div>
        <label class="font-bold text-gray-700 block mb-1">ชื่อผู้สั่ง / เบอร์โทรศัพท์ *</label>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="cust-name" required placeholder="ชื่อของคุณ" class="w-full p-2.5 border rounded-xl bg-gray-50">
          <input type="tel" id="cust-phone" required placeholder="เบอร์โทร" class="w-full p-2.5 border rounded-xl bg-gray-50">
        </div>
      </div>

      <!-- ⏰ ช่องเวลานัดรับเอกสาร -->
      <div>
        <label class="font-bold text-gray-700 block mb-1">⏰ เวลาที่สะดวกมารับเอกสาร *</label>
        <input type="time" id="pickup-time" required class="w-full p-2.5 border rounded-xl bg-gray-50 font-semibold text-gray-800">
      </div>

      <!-- เลือกประเภทบริการ / รูปแบบการพิมพ์ -->
      <div>
        <label class="font-bold text-gray-700 block mb-1">ประเภทบริการ & รูปแบบการพิมพ์ (A4)</label>
        <select id="service-option" onchange="calcPrice()" class="w-full p-2.5 border rounded-xl bg-gray-50 font-semibold text-xs text-gray-800">
          <optgroup label="🖨️ ปริ้นเอกสาร (A4)">
            <option value="print_bw_single">ปริ้น ขาว-ดำ (หน้าเดียว) — 3 ฿/แผ่น (โปร 4 แผ่น 10 ฿)</option>
            <option value="print_bw_double">ปริ้น ขาว-ดำ (หน้า-หลัง) — 4 ฿/แผ่น (โปร 4 แผ่น 15 ฿)</option>
            <option value="print_color_single">ปริ้น สี (หน้าเดียว) — 5 ฿/แผ่น *</option>
            <option value="print_color_double">ปริ้น สี (หน้า-หลัง) — 8 ฿/แผ่น *</option>
          </optgroup>
          <optgroup label="📄 ถ่ายเอกสาร (A4)">
            <option value="copy_bw_single">ถ่ายเอกสาร ขาว-ดำ — 2 ฿/แผ่น</option>
            <option value="copy_color_single">ถ่ายเอกสาร สี — 4 ฿/แผ่น (โปร 3 แผ่น 10 ฿) *</option>
          </optgroup>
        </select>
      </div>

      <div>
        <label class="font-bold text-gray-700 block mb-1">แนบไฟล์เอกสาร (PDF หรือ รูปภาพ) *</label>
        <input type="file" id="file-input" accept=".pdf,image/*" required class="w-full text-xs file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-indigo-50 file:text-indigo-700 font-semibold hover:file:bg-indigo-100">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold text-gray-700 block mb-1">จำนวนหน้าในไฟล์</label>
          <input type="number" id="num-pages" min="1" value="1" onchange="calcPrice()" class="w-full p-2.5 border rounded-xl bg-gray-50 text-center font-bold">
        </div>
        <div>
          <label class="font-bold text-gray-700 block mb-1">จำนวนชุดที่พิมพ์</label>
          <input type="number" id="num-copies" min="1" value="1" onchange="calcPrice()" class="w-full p-2.5 border rounded-xl bg-gray-50 text-center font-bold">
        </div>
      </div>

      <!-- หมายเหตุราคาสี -->
      <div class="text-[10px] text-amber-600 bg-amber-50 p-2 rounded-xl border border-amber-200">
        * หมายเหตุ: งานพิมพ์สี ราคาประเมินอาจมีการพิจารณาปรับตามปริมาณสีจริงของเอกสารหน้าร้าน
      </div>

      <!-- สรุปราคาสั่งพิมพ์ -->
      <div class="bg-indigo-50/80 p-3 rounded-2xl border border-indigo-200 flex justify-between items-center text-indigo-900 mt-2">
        <span class="font-bold text-sm">ประเมินราคาขาย:</span>
        <span id="est-price" class="text-xl font-black text-indigo-700">3.00 ฿</span>
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl transition active:scale-95 text-sm shadow-md">
        🚀 ส่งฝากพิมพ์ / ถ่ายเอกสาร
      </button>
    </form>
  </div>

  <script>
    // 🔗 URL Google Apps Script Web App
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxFNLFRGk6InxObu-_zJcSbBnTRpvk7waJGTjyrnaaZ7i7_XwMzCcWAvG1h4IWkkT9gQ/exec";

    let calculatedTotal = 3.00;

    function calcPrice() {
      const opt = document.getElementById('service-option').value;
      const pages = parseInt(document.getElementById('num-pages').value) || 1;
      const copies = parseInt(document.getElementById('num-copies').value) || 1;
      
      let pricePerCopy = 0;

      if (opt === 'print_bw_single') {
        const sets = Math.floor(pages / 4);
        const rem = pages % 4;
        pricePerCopy = (sets * 10) + (rem * 3);
      } 
      else if (opt === 'print_bw_double') {
        const sheets = Math.ceil(pages / 2);
        const sets = Math.floor(sheets / 4);
        const rem = sheets % 4;
        pricePerCopy = (sets * 15) + (rem * 4);
      } 
      else if (opt === 'print_color_single') {
        pricePerCopy = pages * 5;
      } 
      else if (opt === 'print_color_double') {
        const sheets = Math.ceil(pages / 2);
        pricePerCopy = sheets * 8;
      } 
      else if (opt === 'copy_bw_single') {
        pricePerCopy = pages * 2;
      } 
      else if (opt === 'copy_color_single') {
        const sets = Math.floor(pages / 3);
        const rem = pages % 3;
        pricePerCopy = (sets * 10) + (rem * 4);
      }

      calculatedTotal = pricePerCopy * copies;
      document.getElementById('est-price').innerText = calculatedTotal.toFixed(2) + ' ฿';
    }

    function submitPrintOrder(e) {
      e.preventDefault();
      const fileInput = document.getElementById('file-input');
      if (fileInput.files.length === 0) return;

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("นำ_WEB_APP_URL")) {
        alert("กรุณาใส่ Web App URL ของ Google Apps Script ในโค้ดก่อนครับ");
        return;
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = "⏳ กำลังอัปโหลดไฟล์...";

      const opt = document.getElementById('service-option').value;
      let modeText = "ขาว-ดำ";
      let sidesText = "หน้าเดียว";

      if (opt.includes("color")) modeText = "สี";
      if (opt.includes("double")) sidesText = "หน้า-หลัง";
      if (opt.startsWith("copy")) modeText = "ถ่ายเอกสาร " + modeText;

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(evt) {
        const payload = {
          action: "processPrintPreOrder",
          customerName: document.getElementById('cust-name').value,
          phone: document.getElementById('cust-phone').value,
          pickupTime: document.getElementById('pickup-time').value, // ⏰ ส่งเวลาที่มารับ
          fileName: file.name,
          fileData: evt.target.result,
          paperSize: "A4",
          printMode: modeText,
          printSides: sidesText,
          pages: parseInt(document.getElementById('num-pages').value),
          copies: parseInt(document.getElementById('num-copies').value),
          totalPrice: calculatedTotal
        };

        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
          if (res.success || res.status === "success") {
            alert(`🎉 ฝากพิมพ์/ถ่ายเอกสารสำเร็จ!\nรหัสออเดอร์: ${res.orderId}\nเวลานัดรับ: ${payload.pickupTime} น.\nแจ้งรหัสนี้กับพนักงานเมื่อมารับเอกสารหน้าร้าน`);
            location.reload();
          } else {
            alert("เกิดข้อผิดพลาด: " + (res.error || res.message || "ไม่สามารถส่งข้อมูลได้"));
            btn.disabled = false;
            btn.innerText = "🚀 ส่งฝากพิมพ์ / ถ่ายเอกสาร";
          }
        })
        .catch(err => {
          alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err.message);
          btn.disabled = false;
          btn.innerText = "🚀 ส่งฝากพิมพ์ / ถ่ายเอกสาร";
        });
      };

      reader.readAsDataURL(file);
    }

    window.onload = function() {
      calcPrice();
    };
  </script>
</body>
</html>
