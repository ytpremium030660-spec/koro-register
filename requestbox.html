<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KORO STORE - Request Box</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex items-center justify-center">

  <div class="w-full max-w-md bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl">
        🎁
      </div>
      <h1 class="text-xl font-bold text-white">อยากให้ KORO STORE เอาอะไรมาขาย?</h1>
      <p class="text-xs text-slate-400 mt-1">เสนอไอเทมที่คุณอยากได้ ชิ้นไหนฮิต ร้านจัดมาลงให้แน่นอน!</p>
    </div>

    <!-- Form -->
    <form id="requestForm" class="space-y-4">
      
      <!-- ชื่อสินค้า -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">ชื่อสินค้า / ไอเทมที่ต้องการ <span class="text-rose-400">*</span></label>
        <input type="text" id="productName" required placeholder="เช่น สมุดโน้ตปกนุ่ม, ขนมเยลลี่ผลไม้" 
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <!-- หมวดหมู่ -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">หมวดหมู่สินค้า <span class="text-rose-400">*</span></label>
        <select id="category" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          <option value="">-- เลือกหมวดหมู่ --</option>
          <option value="เครื่องเขียน">✏️ เครื่องเขียน / อุปกรณ์เรียน</option>
          <option value="ขนมกิ๊ฟช็อป">🍬 ขนม / ของกินเล่น</option>
          <option value="ของน่ารัก/ของขวัญ">🧸 ของน่ารัก / กิ๊ฟช็อป / ของขวัญ</option>
          <option value="งานพิมพ์/เอกสาร">📄 บริการงานพิมพ์ / เอกสาร</option>
          <option value="อื่นๆ">✨ อื่นๆ</option>
        </select>
      </div>

      <!-- รูปภาพประกอบ -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">แนบรูปภาพประกอบ (ถ้ามี)</label>
        <div class="relative border-2 border-dashed border-slate-700 rounded-xl p-4 text-center bg-slate-900/50 hover:border-indigo-500 transition cursor-pointer">
          <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewImage(event)">
          <div id="uploadPlaceholder">
            <span class="text-2xl">📸</span>
            <p class="text-xs text-slate-400 mt-1">กดเพื่อเลือกรูปภาพ</p>
          </div>
          <img id="imagePreview" class="hidden max-h-36 mx-auto rounded-lg object-contain shadow-md" />
        </div>
      </div>

      <!-- รายละเอียดเพิ่มเติม -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">รายละเอียดเพิ่มเติม / แบรนด์ / ยี่ห้อ</label>
        <textarea id="note" rows="2" placeholder="เช่น ยี่ห้อ..., ขอเป็นสีพาสเทล" 
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <!-- ปุ่มส่ง -->
      <button type="submit" id="submitBtn" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
        <span>🚀 ส่งรีเควสสินค้า</span>
      </button>
    </form>

    <!-- Message Display -->
    <div id="statusMsg" class="hidden mt-4 text-center text-sm p-3 rounded-xl"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxztE0lLapyMeHmbp8rG1bwGdnMFlpVk2MRqYRAcd7jrfMUDStG7dxU7r6kYVBkB4r6sQ/exec";

    let base64Image = "";
    let imageName = "";

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      imageName = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const max_size = 800;

          if (width > height && width > max_size) {
            height *= max_size / width;
            width = max_size;
          } else if (height > max_size) {
            width *= max_size / height;
            height = max_size;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          base64Image = canvas.toDataURL('image/jpeg', 0.7);

          document.getElementById('imagePreview').src = base64Image;
          document.getElementById('imagePreview').classList.remove('hidden');
          document.getElementById('uploadPlaceholder').classList.add('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('requestForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>⏳ กำลังบันทึกข้อมูล...</span>`;
      statusMsg.className = "hidden";

      // 🟢 ปรับการดึงค่า customerName ให้ปลอดภัยขึ้น หากไม่มีช่องกรอกชื่อจะไม่เกิด Error
      const customerElem = document.getElementById('customerName');
      const customerVal = customerElem ? customerElem.value : "ลูกค้าทั่วไป";

      const payload = {
        action: "submitProductRequest",
        productName: document.getElementById('productName').value,
        category: document.getElementById('category').value,
        note: document.getElementById('note').value,
        customerName: customerVal,
        imageBase64: base64Image,
        imageName: imageName
      };

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        signal: controller.signal
      })
      .then(res => {
        clearTimeout(timeoutId);
        return res.text();
      })
      .then(text => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>🚀 ส่งรีเควสสินค้า</span>`;
        statusMsg.classList.remove("hidden");
        
        let res;
        try {
          res = JSON.parse(text);
        } catch (pErr) {
          statusMsg.className = "mt-4 text-center text-xs p-3 rounded-xl bg-rose-500/20 text-rose-400 border border-rose-500/30";
          statusMsg.innerText = "❌ ตอบกลับจาก Google ไม่ถูกต้อง";
          return;
        }

        if (res.status === "success") {
          statusMsg.className = "mt-4 text-center text-xs p-3 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
          statusMsg.innerText = res.message || "ส่งคำขอเรียบร้อยแล้ว!";
          document.getElementById('requestForm').reset();
          document.getElementById('imagePreview').classList.add('hidden');
          document.getElementById('uploadPlaceholder').classList.remove('hidden');
          base64Image = "";
          imageName = "";
        } else {
          statusMsg.className = "mt-4 text-center text-xs p-3 rounded-xl bg-rose-500/20 text-rose-400 border border-rose-500/30";
          statusMsg.innerText = "เกิดข้อผิดพลาด: " + (res.message || "ไม่สามารถทำรายการได้");
        }
      })
      .catch(err => {
        clearTimeout(timeoutId);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>🚀 ส่งรีเควสสินค้า</span>`;
        statusMsg.classList.remove("hidden");
        statusMsg.className = "mt-4 text-center text-xs p-3 rounded-xl bg-rose-500/20 text-rose-400 border border-rose-500/30";
        
        if (err.name === 'AbortError') {
          statusMsg.innerText = "⚠️ การเชื่อมต่อหมดเวลา (Timeout) กรุณาลองใหม่อีกครั้ง";
        } else {
          statusMsg.innerText = "❌ ไม่สามารถเชื่อมต่อได้: " + err.message;
        }
      });
    });
  </script>
</body>
</html>
