<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KORO STORE - ฝากพิมพ์งานล่วงหน้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 font-sans text-gray-800">
  <div class="max-w-md mx-auto bg-white rounded-3xl p-6 shadow-xl border space-y-4">
    <div class="text-center border-b pb-3">
      <h2 class="text-xl font-black text-indigo-900">📑 ฝากพิมพ์เอกสาร KORO STORE</h2>
      <p class="text-xs text-gray-500">ส่งไฟล์ล่วงหน้า มารับเอกสารหน้าร้านได้เลยไม่ต้องรอคิว</p>
    </div>

    <form id="print-form" onsubmit="submitPrintOrder(event)" class="space-y-3 text-xs">
      <div>
        <label class="font-bold text-gray-700 block mb-1">ชื่อผู้สั่ง / เบอร์โทรศัพท์ *</label>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="cust-name" required placeholder="ชื่อของคุณ" class="w-full p-2.5 border rounded-xl bg-gray-50">
          <input type="tel" id="cust-phone" required placeholder="เบอร์โทร" class="w-full p-2.5 border rounded-xl bg-gray-50">
        </div>
      </div>

      <div>
        <label class="font-bold text-gray-700 block mb-1">แนบไฟล์เอกสาร (PDF หรือ รูปภาพ) *</label>
        <input type="file" id="file-input" accept=".pdf,image/*" required class="w-full text-xs file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-indigo-50 file:text-indigo-700 font-semibold hover:file:bg-indigo-100">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold text-gray-700 block mb-1">สีการพิมพ์</label>
          <select id="print-mode" onchange="calcPrice()" class="w-full p-2.5 border rounded-xl bg-gray-50 font-semibold">
            <option value="bw">ขาว-ดำ (หน้าละ 1.50 ฿)</option>
            <option value="color">สี (หน้าละ 5.00 ฿)</option>
          </select>
        </div>
        <div>
          <label class="font-bold text-gray-700 block mb-1">การพิมพ์หน้า-หลัง</label>
          <select id="print-sides" onchange="calcPrice()" class="w-full p-2.5 border rounded-xl bg-gray-50">
            <option value="single">หน้าเดียว</option>
            <option value="double">หน้า-หลัง</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold text-gray-700 block mb-1">จำนวนหน้าในไฟล์</label>
          <input type="number" id="num-pages" min="1" value="1" onchange="calcPrice()" class="w-full p-2.5 border rounded-xl bg-gray-50 text-center font-bold">
        </div>
        <div>
          <label class="font-bold text-gray-700 block mb-1">จำนวนชุดที่พิมพ์</label>
          <input type="number" id="num-copies" min="1" value="1" onchange="calcPrice()" class="w-full p-2.5 border rounded-xl bg-gray-50 text-center font-bold">
        </div>
      </div>

      <!-- สรุปราคาสั่งพิมพ์ -->
      <div class="bg-indigo-50/80 p-3 rounded-2xl border border-indigo-200 flex justify-between items-center text-indigo-900 mt-2">
        <span class="font-bold text-sm">ประเมินราคาขาย:</span>
        <span id="est-price" class="text-xl font-black text-indigo-700">1.50 ฿</span>
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl transition active:scale-95 text-sm shadow-md">
        🚀 ส่งฝากพิมพ์งาน
      </button>
    </form>
  </div>

  <script>
    // 🔗 นำ Web App URL ของ Google Apps Script มาใส่ตรงนี้
    const APPS_SCRIPT_URL = "นำ_WEB_APP_URL_จาก_GOOGLE_APPS_SCRIPT_มาวางตรงนี้";

    let calculatedTotal = 1.5;

    function calcPrice() {
      const mode = document.getElementById('print-mode').value;
      const pages = parseInt(document.getElementById('num-pages').value) || 1;
      const copies = parseInt(document.getElementById('num-copies').value) || 1;
      const ratePerPage = mode === 'bw' ? 1.5 : 5.0;
      
      calculatedTotal = ratePerPage * pages * copies;
      document.getElementById('est-price').innerText = calculatedTotal.toFixed(2) + ' ฿';
    }

    function submitPrintOrder(e) {
      e.preventDefault();
      const fileInput = document.getElementById('file-input');
      if (fileInput.files.length === 0) return;

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("นำ_WEB_APP_URL")) {
        alert("กรุณาใส่ Web App URL ของ Google Apps Script ในโค้ดก่อนครับ");
        return;
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = "⏳ กำลังอัปโหลดไฟล์...";

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(evt) {
        const payload = {
          action: "processPrintPreOrder",
          customerName: document.getElementById('cust-name').value,
          phone: document.getElementById('cust-phone').value,
          fileName: file.name,
          fileData: evt.target.result,
          paperSize: "A4",
          printMode: document.getElementById('print-mode').value === 'bw' ? 'ขาว-ดำ' : 'สี',
          printSides: document.getElementById('print-sides').value === 'single' ? 'หน้าเดียว' : 'หน้า-หลัง',
          pages: parseInt(document.getElementById('num-pages').value),
          copies: parseInt(document.getElementById('num-copies').value),
          totalPrice: calculatedTotal
        };

        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            alert(`🎉 ฝากพิมพ์งานสำเร็จ!\nรหัสออเดอร์: ${res.orderId}\nแจ้งรหัสนี้กับพนักงานเมื่อมารับเอกสารหน้าร้าน`);
            location.reload();
          } else {
            alert("เกิดข้อผิดพลาด: " + (res.error || "ไม่สามารถส่งข้อมูลได้"));
            btn.disabled = false;
            btn.innerText = "🚀 ส่งฝากพิมพ์งาน";
          }
        })
        .catch(err => {
          alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + err.message);
          btn.disabled = false;
          btn.innerText = "🚀 ส่งฝากพิมพ์งาน";
        });
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
